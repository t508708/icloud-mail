server {
    listen 80;
    server_name icloud-us.gooelv.com icloud.us.gooelv.com imap-icloud.us.gooelv.com;

    access_log off;
    error_log /www/wwwlogs/icloud-mail.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/icloud-mail-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://icloud-us.gooelv.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name icloud-us.gooelv.com icloud.us.gooelv.com;
    http2 on;

    include /www/server/panel/vhost/nginx/extension/icloud-mail/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/icloud.us.gooelv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icloud.us.gooelv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:icloud_mail_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OTP endpoints may contain tokens in the query string.
    access_log off;
    error_log /www/wwwlogs/icloud-mail.error.log crit;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # The admin bundle may be cached; HTML and API routes above remain no-store.
    location ^~ /admin/assets/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        gzip_proxied any;
    }
}
