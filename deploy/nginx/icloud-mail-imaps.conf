# The application terminates TLS using the renewed public certificate.
# Bind the public address explicitly to preserve the Docker loopback listener.
server {
    listen 23.251.34.11:1993;
    proxy_pass 127.0.0.1:1993;
    proxy_connect_timeout 5s;
    proxy_timeout 30m;
    access_log off;
    error_log /www/wwwlogs/icloud-mail-imaps.error.log crit;
}
