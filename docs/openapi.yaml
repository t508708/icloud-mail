            - scheduled
            - paused
            - login_required
            - error
          description: 当前计划状态；login_required 表示需重新登录 Apple，会话失效不会自动关闭开关。
        planned_at:
          type:
            - string
            - "null"
          format: date-time
          description: 当前剩余计划的第一个时间点；没有剩余计划时为 null。
        planned_times:
          type: array
          items:
            type: string
            format: date-time
          description: 当前剩余计划的全部 UTC 时间点，最多 5 个。
        next_run_at:
          type:
            - string
            - "null"
          format: date-time
        last_attempted_at:
          type:
            - string
            - "null"
          format: date-time
        last_created_at:
          type:
            - string
            - "null"
          format: date-time
        last_alias_address:
          type: string
        last_error:
          type: string
          description: 最近一次尝试的截断错误信息；不会包含原始 API Key 或 Apple 会话材料。
        pending_key_count:
          type: integer
          minimum: 0
        pending_auto_created_key_count:
          type: integer
          minimum: 0

    OTPRecord:
