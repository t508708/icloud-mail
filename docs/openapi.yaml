          admin_path:
            default: 00000000000000000000000000000000/admin
            description: keys 卷中管理路径去掉首尾斜杠后的值
      - url: https://HOST/admin
        description: 固定兼容入口；会话认证和访问隔离规则相同
    get:
      tags: [Administration]
      operationId: getAliasBatchDeleteJob
      summary: 按 ID 轮询当前管理员的批量 Apple 删除任务
      description: |
        每次查询都校验有效管理 Session 和任务所有者；ID 格式无效或当前管理员名下无该任务时返回 404。
        不同管理员有同 job_id 时，各自只读到自己的任务，不泄露其他管理员的记录。
        job_id 本身不授予读取权限。GET 不要求 X-CSRF-Token。completed/interrupted 为终态，
        读取状态不会重放任务。interrupted 时剩余项的 BATCH_DELETE_INTERRUPTED 只表示
        远端结果待核查，不承诺本地记录仍在；详见任务 Schema 的 results 说明。
      security:
        - adminSession: []
      parameters:
        - name: jobID
          in: path
          required: true
          description: 原提交的 operation_id，即 job_id；未收到提交响应也可直接用原键查询。
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]{16,128}$'
      responses:
        "200":
          description: 指定任务的当前进度或终态快照。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAliasBatchDeleteJobResponse"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "404":
          description: ID 格式无效或当前管理员名下无该任务时返回 NOT_FOUND，不泄露其他管理员的同 ID 任务。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "500":
          $ref: "#/components/responses/AdminInternalError"

