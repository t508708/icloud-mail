          type: string
          enum:
            - login_required
            - verification_required
            - authenticated
            - expired
          description: |
            login_required 表示尚无会话；verification_required 表示正在等待验证码；
            authenticated 表示可同步目录；expired 表示需要重新登录。
        apple_id:
          type: string
          description: 连接的 Apple ID；尚无会话时为空字符串。
        region:
          type: string
          enum:
            - ""
            - global
            - cn
          description: Apple 服务区域；尚无会话时为空字符串。
        authenticated_at:
          type:
            - string
            - "null"
          format: date-time
          description: 受信任会话认证完成的 UTC 时间；未完成登录时为 null。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 已知的会话或验证码挑战到期时间；上游未提供时为 null。

    AdminAliasAutoCreation:
      type: object
      additionalProperties: false
      required:
        - enabled
        - status
        - planned_at
        - planned_times
        - next_run_at
        - last_attempted_at
        - last_created_at
        - last_alias_address
        - last_error
        - pending_key_count
        - pending_auto_created_key_count
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
