          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          required: false
          description: 在该主号的隐私邮箱列表中跳过的邮箱数。
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: 主号详情及所属隐私邮箱的当前数据库分页
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
