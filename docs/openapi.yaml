          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"

  /api/v1/aliases/batch:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    delete:
      tags: [Administration]
      operationId: deleteAliasesFromApple
      summary: 从 Apple 批量永久删除隐私邮箱
      description: |
        仅接受已经完成 Apple 登录、邮箱模式为 `icloud` 且主号没有同步错误的隐私邮箱。
        服务会先检查本次请求中的全部邮箱和主号，在第一项远端变更前完成资格校验；随后对每个
        邮箱调用 Apple 的停用（必要时）和永久删除流程。只有 Apple 端确认该地址已经删除后，
        才删除本地记录；新一次读取的 Apple 目录确认地址已不存在时，也可清理本地记录，
        旧缓存中的缺失本身不构成确认。返回结果按邮箱逐项报告；明确失败项的本地记录保留，已成功删除的
        其他项目不会回滚。等待 Apple 目录确认的邮箱和自定义邮箱不适用此接口。

        省略 `async` 时保留原同步行为及 200 响应。`async=1` 时正文使用
        AdminAsyncDeleteAliasesRequest，必须带 `operation_id`：16–128 个 ASCII 字母、数字、
        `-` 或 `_`，建议使用 UUID；返回 202 任务快照，不等待整批远端删除完成。
        请求体 Schema 的 oneOf 描述两种正文结构；query 与正文的联动约束由服务校验，
        异步模式省略或提供无效 `operation_id` 返回 400。

        `job_id` 等于 `operation_id`，任务身份、幂等键和读取均按管理员隔离；
        不同管理员可使用相同键创建各自的任务。同一管理员以相同键和完全相同、顺序一致的
        `alias_ids` 重复提交，返回原任务（包括已 completed/interrupted 的任务），不重复
        删除也不新占名额。服务先查幂等键，再预检新任务的邮箱，已删除的本地 ID 不影响此类重试。
        同一管理员的同键并发提交也按此幂等约定处理，仅创建一个任务。
        同一管理员的同键不同列表（含顺序变化）返回 409 IDEMPOTENCY_CONFLICT。
        客户端在首次提交前保存原键和原列表；响应丢失时优先直接
        GET /aliases/batch/jobs/<原 operation_id>，无需先收到 job_id。未保存键时可用 jobs/latest
        找回当前管理员任务；不要因超时生成新键或重排、删减原列表。

        每管理员最多 1 个 active（queued/running）任务，服务全局最多 2 个；新任务遇到
        当前管理员已有 active 任务返回 409 BATCH_DELETE_IN_PROGRESS，服务满返回
        429 BATCH_DELETE_BUSY，后台尚未启动或正在关闭返回 503 BATCH_DELETE_UNAVAILABLE。
        凭据正在轮换时也返回 409 BATCH_DELETE_IN_PROGRESS；不同管理员的同键任务互不冲突。
        后台运行上限 2 小时，提交请求的断开不取消已接收任务；管理会话和凭据轮换保护仍然适用。
        任务进度与逐项 audit 在同一事务中持久化，停止服务有界等待收尾；重启将遗留
        未终结任务标为 interrupted，不自动重放。interrupted 时 HTTP 合成的剩余项使用
        BATCH_DELETE_INTERRUPTED，表示远端结果待核查；这些项计入 failed、不计入 processed，
        local_retained 为 false 且在 JSON 中省略，不证明本地已删除或仍在。

        同一账号逐条处理并复用 validate/directory，沿用响应更新后的滚动会话；
        每个任务内不同账号最多 2 路活动执行，与全局最多 2 个 active 任务是两层限制。
        限流等待只暂停对应主号且不占活动执行名额；其他未限流主号继续处理，
        多个主号同时冷却也不会挡住后续正常主号。waits 可以与其他主号增长的 processed/deleted 同时出现。
        异常时重新读取并验证远端状态，不以直接删除本地记录替代 Apple 确认。
        后台模式同账号请求至少间隔 1 秒；出现限流按 60、120、240 秒退避等待，
        Apple Retry-After 指定更长等待时尊重该值。每个主号在整批最多恢复 3 次，
        等待保持 running 并返回 waits，不计为已处理或失败；结束等待后用新目录核对再继续，
        不盲目重放停用或删除。持续受限时后续未执行项返回 APPLE_BATCH_DEFERRED，
        可选 deferred 是 failed 的子集。同步兼容接口及单条删除不启用此后台等待策略。
        冷却期间仍可开启或关闭自动创建隐私邮箱；开关只更新本地计划，不绕过 Apple 冷却。
        同一主号的实际 Apple 操作仍串行，批量删除恢复前重新获取账号锁并检查身份及邮箱状态。
        同账号、无异常且 N 个地址均需先停用的模拟调用计数可从 4N 降为 2N+2；这不是
        固定加速比。实际时长和成功数仍取决于 Apple，单次 1000 项上限不是全部成功承诺。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminCSRFToken"
        - name: async
          in: query
          required: false
          description: 设为 1 时提交后台任务，正文必须包含 operation_id；省略时使用原同步接口。
          schema:
            type: integer
            enum: [1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AdminDeleteAliasesRequest"
                - $ref: "#/components/schemas/AdminAsyncDeleteAliasesRequest"
            examples:
              synchronous:
                summary: 省略 async 的同步请求
                value:
                  alias_ids: [101, 102, 103]
              asynchronous:
                summary: async=1 的幂等后台任务请求
                value:
                  alias_ids: [101, 102, 103]
                  operation_id: a1b2c3d4-5678-4abc-8def-0123456789ab
      responses:
        "200":
          description: 原同步模式的 Apple 删除结果及本地记录处理结果；格式保持不变。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAliasBatchDeleteResponse"
        "202":
          description: 异步任务已接收，或幂等重试返回原任务的当前快照；不表示全部删除成功。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAliasBatchDeleteJobResponse"
              example:
                data:
                  job_id: a1b2c3d4-5678-4abc-8def-0123456789ab
                  status: queued
                  requested: 3
                  processed: 0
                  deleted: 0
                  failed: 0
                  results: []
                  request_id: 6oe7j0x3x3pJv9Dv
                  created_at: "2026-09-08T10:00:00Z"
                  updated_at: "2026-09-08T10:00:00Z"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "404":
          $ref: "#/components/responses/AdminAliasOrMailGroupNotFound"
        "409":
          $ref: "#/components/responses/AdminBatchAliasDeleteConflict"
        "413":
          $ref: "#/components/responses/AdminRequestTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "429":
          $ref: "#/components/responses/AdminBatchAliasDeleteBusy"
        "500":
          $ref: "#/components/responses/AdminInternalError"
        "502":
          description: Apple 远端服务异常；本地记录保留
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppleErrorResponse"
        "503":
          $ref: "#/components/responses/AdminBatchAliasDeleteUnavailable"

  /api/v1/aliases/batch/jobs/latest:
