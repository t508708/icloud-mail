  /api/v1/aliases/rotate-all-credentials:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    post:
      tags:
        - Administration
      operationId: rotateAllAliasCredentials
      summary: 一键迁移并轮换所有 alias 凭据
      description: |
        高影响的显式管理操作。在单一事务中把所有 legacy alias 强制迁移为 v2，并为所有
        现有 v2 alias 轮换整套凭据。存在 `pending_alias_api_keys` 的 alias 也会轮换：
        pending 记录同步更新为新凭证包的 API Key，既有 Apple 目录确认与领取流程不变。
        任何一步失败都会回滚全部轮换。

        请求必须携带有效管理 Session、CSRF token、精确确认值和当前管理员密码；
        当前密码重认证使用独立限流。`current_password` 与 `confirmation` 只用于本次
        校验，不得写入访问日志、应用日志或审计详情，服务也不得记录该请求体。

        服务存在任一管理员的 active（queued/running）批量 Apple 删除任务时，返回
        409 BATCH_DELETE_IN_PROGRESS，不执行轮换，也不持有轮换锁等待后台删除，
        以保持任务进度可轮询。应等待删除任务结束后再重试轮换。

        成功后，legacy alias 的旧 API Key 与 v1 直达链接失效；v2 alias 的旧 API Key、
        OTP 与 recent-mail 派生链接、IMAP 密码、client ID、refresh token 和已签发 access token
        全部失效。OTP URL 路径仍为 `/api/v1/otp`，新 OTP token 继续使用用途隔离的
        v3 公开信封版本。邮件归档、兼容消费记录、邮件已读状态和 IMAP Seen 任务保留。
        响应的 `data` 只返回数量汇总，不返回任何新凭据；`rotated_pending` 是已轮换
        alias 的子集。成功事务还会在不修改密码哈希的情况下提升执行管理员的
        `password_version`、删除该管理员全部后台 Session，并清除随机管理路径与固定
        `/admin` 路径的 Session Cookie，因此调用方必须重新登录。

        本操作与会消费或返回 alias 凭据的公开 HTTP 请求线性化：`GET /api/v1/otp`、
        `GET /api/v1/mail/latest`、`GET /api/v1/mail/recent[/]`、
        `POST /oauth2/v2.0/token` 和外部 `POST /api/v1/aliases[/]` 从鉴权前一直保护到
        响应写完。全量轮换等待这些已在途请求完成后才提交并返回成功；成功响应后，
        使用任何旧 HTTP 凭据发起的新请求都会被拒绝，不引入新的错误码或状态码。

        IMAPS 不受上述 HTTP 等待边界约束。轮换提交后，旧 IMAP 密码和旧 access token
        立即不能建立新会话；已有会话会在下一条 SELECT、LIST、STATUS、FETCH、SEARCH
        或轮询命令复验凭据版本并拒绝继续操作，IDLE 最迟在下一次轮询 tick 失效。
        提交时已经通过复验并开始执行的单条命令可以完成。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRotateAllCredentialsRequest"
            example:
              confirmation: ROTATE_ALL
              current_password: CURRENT_ADMIN_PASSWORD
      responses:
        "200":
          description: 全量迁移与轮换完成；只返回计数、不返回凭据，且执行管理员必须重新登录
          headers:
            Cache-Control:
              description: 禁止缓存本次轮换结果。
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRotateAllCredentialsResponse"
              example:
                data:
                  total: 120
                  rotated: 120
                  migrated_legacy: 42
                  rotated_v2: 78
                  rotated_pending: 2
                  reauthentication_required: true
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminRotationUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          description: |
            CREDENTIALS_CHANGED 表示轮换提交前管理员凭据版本已并发变化；轮换事务回滚并
            清除当前浏览器的管理 Session Cookie，调用方须重新登录。
            BATCH_DELETE_IN_PROGRESS 表示服务存在 active 删除任务；本次不执行轮换，
            不占锁等待后台删除，调用方应等待任务结束后重试。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "413":
          $ref: "#/components/responses/AdminRequestTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "429":
          $ref: "#/components/responses/AdminRateLimited"
        "500":
          $ref: "#/components/responses/AdminInternalError"

  /api/v1/aliases/{id}/rotate-key:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    post:
      tags:
        - Legacy Compatibility
      operationId: rotateLegacyAliasKey
      summary: 兼容轮换 alias 的 API Key
      description: |
        只替换 API Key 及由它派生的旧直达链接，不改变 credential mode，
        不清除消费记录、邮件快照或 IMAP Seen 状态，也不替换 v2 alias 的
        IMAP 密码、client ID、refresh token 和 credential version。
        本次响应直接返回新 API Key；legacy alias 不保存可恢复明文，v2 alias 的当前
        凭证仍可由已认证管理端读取。schema 迁移不会调用此接口。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAliasID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "200":
          description: 在本次受保护响应中直接返回新 API Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOneTimeKeyResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminAliasConflict"
        "500":
          $ref: "#/components/responses/AdminInternalError"

  /api/v1/aliases/{id}/rotate-credentials:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    post:
      tags:
        - Administration
      operationId: rotateAliasCredentials
      summary: 轮换 v2 alias 的完整凭证包
      description: |
        仅接受 v2 alias。显式调用后同时替换 API Key、派生取码 URL、IMAP 密码、
        client ID 和 refresh token，并使已有 access token 失效；不清除邮件归档、
        兼容消费记录或 IMAP Seen 状态。legacy alias 和等待目录确认的 alias 返回 409。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAliasID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "200":
          description: 返回新的完整凭证；当前 v2 凭证随后仍可由已认证管理端读取
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAliasResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminAliasConflict"
        "500":
          $ref: "#/components/responses/AdminInternalError"

components:
  securitySchemes:
    externalOAuthToken:
      type: http
      scheme: bearer
      bearerFormat: deployment OAuth token
    aliasAPIKey:
      type: http
      scheme: bearer
      bearerFormat: service-issued API Key
    derivedToken:
      type: apiKey
      in: query
      name: token
      description: 仅授权只读 OTP 历史；不能用于消费 recent-mail。
    aliasAPIKeyQuery:
      type: apiKey
      in: query
      name: api_key
    poolKey:
      type: http
      scheme: bearer
      bearerFormat: pool project Key
      description: 以 `pool_` 开头的项目 Key；仅与管理员 Session 组合时可调用 Pool 已使用邮箱退休删除接口。
    adminSession:
      type: apiKey
      in: cookie
      name: icloud_admin_session
  parameters:
    AdminAccountID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminAliasID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  headers:
    RequestID:
      description: 服务端生成的请求追踪标识；错误响应体中的 request_id 与此值一致。
      schema:
        type: string
      example: 6oe7j0x3x3pJv9Dv
    AdminNoStore:
      description: 禁止保存包含后台状态或一次性凭据的响应。
      schema:
        type: string
        const: no-store, private
      example: no-store, private
    AdminAliasBatchDeleteCacheControl:
      description: 任务处理器返回 no-store；同步删除或进入任务处理器前的错误响应使用管理默认值 no-store, private。
      schema:
        type: string
        enum: [no-store, "no-store, private"]
      example: no-store



  schemas:
    AdminAccountListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccountPage"

    AdminAppleErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/AdminAppleError"

    AdminCreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - mailbox_type
        - imap_username
        - imap_password
      allOf:
        - if:
            properties:
              mailbox_type:
                const: custom
          then:
            anyOf:
              - required: [email_suffix]
              - required: [custom_email]
          else:
            required: [email]
      properties:
        name:
          type: string
          maxLength: 80
          description: 可选备注；服务会去除首尾空白。
        email:
          type: string
          format: email
          description: |
            iCloud 模式下必填并作为主号邮箱；自定义模式应省略，服务会根据邮箱后缀生成内部兼容身份。
            iCloud 邮箱保存前会规范化大小写和首尾空白。
        mailbox_type:
          type: string
          enum: [icloud, custom]
          description: 创建时必须显式指定邮箱模式；`icloud` 保持原有 Apple 规则，`custom` 使用自定义邮箱后缀。
        provider:
          type: string
          enum: [icloud, custom]
          description: 服务端保留的 `mailbox_type` 兼容别名；规范请求仍须显式提供 `mailbox_type`，二者同时提供时以后者为准。
        account_type:
          type: string
          enum: [icloud, custom]
          description: 服务端保留的 `mailbox_type` 兼容别名；规范请求仍须显式提供 `mailbox_type`。
        email_suffix:
          type: string
          maxLength: 242
          pattern: '^@?[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$'
          description: 自定义模式必填的邮箱后缀，可带一个开头的 `@`；规范化后最多 241 字节，统一为小写且不含 `@`，并且不能与其他自定义主号重复。
        custom_email:
          type: string
          description: "`email_suffix` 的兼容别名。"
        imap_host:
          type: string
          minLength: 1
          default: imap.mail.me.com
          description: |
            隐式 TLS IMAP 主机名或 IP 地址，省略时使用 `imap.mail.me.com`。对 iCloud 隐私邮箱而言，
            使用默认主机和主号用户名表示直连 iCloud；填写第三方主机（或非主号 IMAP 用户名）表示
            转发第三方 IMAP 路由。显式 `null` 无效。
            服务会先去除首尾空白，之后在去除末尾根点前要求值最多 253 字节，并拒绝主机内部
            空白；IPv6 地址必须不带方括号。服务不接受 URL scheme、用户信息、端口、路径、查询
            或 fragment；DNS 标签只能包含字母、数字和连字符，且不能以连字符开头或结尾。DNS
            主机会去除末尾根点并规范化为小写，IP 地址会规范化。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 993
          description: 隐式 TLS IMAP 端口；省略时使用 993，显式 `null` 无效。
        imap_username:
          type: string
          minLength: 1
          description: IMAP 登录用户名；服务会去除首尾空白。
        imap_password:
          type: string
          minLength: 1
          writeOnly: true
          description: IMAP 密码；直连 iCloud 使用 App 专用密码并去除首尾空白；iCloud 转发第三方 IMAP 和 custom 模式按原值加密保存。不会在响应中返回。

    AdminAccountResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccount"

    AdminAccountDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccountDetail"

    AdminUpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - imap_username
        - enabled
      properties:
        name:
          type: string
          maxLength: 80
          description: 可选备注；服务会去除首尾空白。
        email:
          type: string
          format: email
          description: iCloud 模式下的主号邮箱；已有隐私邮箱时必须与当前值一致。
        mailbox_type:
          type: string
          enum: [icloud, custom]
          description: 邮箱模式；省略时保留当前模式。
        provider:
          type: string
          enum: [icloud, custom]
          description: "`mailbox_type` 的兼容别名。"
        account_type:
          type: string
          enum: [icloud, custom]
          description: "`mailbox_type` 的兼容别名。"
        email_suffix:
          type: string
          maxLength: 242
          pattern: '^@?[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$'
          description: 自定义模式的邮箱后缀；规范化后最多 241 字节，不得与其他自定义主号重复，已有隐私邮箱时不可修改。
        custom_email:
          type: string
          description: "`email_suffix` 的兼容别名。"
        imap_host:
          type: string
          minLength: 1
          description: |
            新的隐式 TLS IMAP 主机名或 IP 地址；省略时保留当前主机。对 iCloud 隐私邮箱而言，
            使用默认主机和主号用户名表示直连 iCloud；填写第三方主机（或非主号 IMAP 用户名）表示
            转发第三方 IMAP 路由。显式 `null` 无效。服务会
            先去除首尾空白，之后在去除末尾根点前要求值最多 253 字节，并拒绝主机内部空白；
            IPv6 地址必须不带方括号。显式空字符串也无效。不接受 URL scheme、用户信息、端口、
            路径、查询或 fragment；DNS 标签只能包含字母、数字和连字符，且不能以连字符开头或
            结尾。DNS 主机会去除末尾根点并规范化为小写，IP 地址会规范化。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 新的隐式 TLS IMAP 端口；省略时保留当前端口，显式 `null` 无效。
        imap_username:
          type: string
          minLength: 1
          description: |
            IMAP 登录用户名；服务会去除首尾空白，已有隐私邮箱时仍可修改。使用 iCloud 隐私邮箱
            转发到第三方邮箱时，应把它填写为第三方 IMAP 登录/最终物理投递目标地址，以便同步校验投递标头。规范化后的值
            实际变化会清理旧邮箱来源的同步游标、兼容快照、消费历史、待处理 `\Seen` 任务、v2 归档
            和 OTP 历史，轮换公开 IMAPS 的 UIDVALIDITY，并重置同步状态。
        imap_password:
          type:
            - string
            - "null"
          writeOnly: true
          description: 新 IMAP 密码；直连 iCloud 使用 App 专用密码并去除首尾空白，iCloud 转发第三方 IMAP 和 custom 模式按原值保存；省略、传 `null` 或传空字符串时保留当前密码。
        enabled:
          type: boolean
          description: 是否启用该主号的邮件同步和所属隐私邮箱 Key。

    AdminAccountPage:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        pagination:
          $ref: "#/components/schemas/AdminAccountPagination"

    AdminAppleError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - SESSION_EXPIRED
            - CSRF_INVALID
            - INVALID_CREDENTIALS
            - CURRENT_PASSWORD_INVALID
            - CREDENTIALS_CHANGED
            - RATE_LIMITED
            - NOT_FOUND
            - INVALID_JSON
            - VALIDATION_FAILED
            - REQUEST_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - APPLE_LOGIN_REQUIRED
            - APPLE_SESSION_EXPIRED
            - APPLE_CREDENTIALS_INVALID
            - APPLE_VERIFICATION_INVALID
            - APPLE_FLOW_EXPIRED
            - APPLE_ACCOUNT_ACTION_REQUIRED
            - APPLE_RATE_LIMITED
            - APPLE_UPSTREAM_ERROR
            - AUTO_CREATION_UNAVAILABLE
            - ACCOUNT_DISABLED
            - ACCOUNT_EXISTS
            - ACCOUNT_IDENTITY_LOCKED
            - APPLE_ACCOUNT_MISMATCH
            - ACCOUNT_CHANGED
            - ALIAS_OWNERSHIP_CONFLICT
            - ALIAS_CONFIRMATION_PENDING
            - ALIAS_EXISTS
            - ALIAS_LIMIT_REACHED
            - CUSTOM_MAILBOX_NO_APPLE
            - CUSTOM_MAILBOX_REQUIRED
            - BATCH_DELETE_NOT_ELIGIBLE
            - BATCH_DELETE_IN_PROGRESS
            - BATCH_DELETE_BUSY
            - BATCH_DELETE_UNAVAILABLE
            - BATCH_DELETE_INTERRUPTED
            - IDEMPOTENCY_CONFLICT
            - SYNC_FAILED
            - INTERNAL_ERROR
          description: |
            Apple 会话错误使用 APPLE_ 前缀，与后台登录会话的 AUTH_REQUIRED/SESSION_EXPIRED 分离。
        message:
          type: string
        request_id:
          type: string
          description: 与 X-Request-ID 响应头相同的请求追踪标识。

    AdminAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - imap_host
        - imap_port
        - imap_username
        - enabled
        - last_sync_status
        - last_sync_error
        - last_sync_error_log
        - last_synced_at
        - created_at
        - updated_at
        - alias_count
        - mailbox_type
        - provider
        - email_suffix
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
          description: iCloud 主号邮箱；custom 模式返回由邮箱后缀派生的内部兼容身份，管理界面不显示该值。
        imap_host:
          type: string
          minLength: 1
          maxLength: 253
          description: 该主号实际使用的隐式 TLS IMAP 主机名或 IP 地址。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 该主号实际使用的隐式 TLS IMAP 端口。
        imap_username:
          type: string
        enabled:
          type: boolean
        last_sync_status:
          type: string
        last_sync_error:
          type: string
          description: 最近同步错误的简短摘要；最近一次同步没有错误时为空字符串。
        last_sync_error_log:
          type: string
          description: 最近同步错误的完整日志；最近一次同步没有错误时为空字符串。
        last_synced_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        alias_count:
          type: integer
          minimum: 0
        mailbox_type:
          type: string
          enum: [icloud, custom]
        provider:
          type: string
          enum: [icloud, custom]
          description: "`mailbox_type` 的兼容回显字段。"
        email_suffix:
          type: string
          description: 自定义邮箱生成使用的后缀；iCloud 模式为空字符串。
        sync_progress:
          $ref: "#/components/schemas/AdminSyncProgress"

    AdminAccountDetail:
      type: object
      additionalProperties: false
      description: |
        `aliases` 与 `pagination` 组成该主号隐私邮箱的一个数据库分页。GET 主号详情使用请求的
        `limit` 和 `offset`；手动邮件同步及 Apple 隐私邮箱同步响应中嵌入的详情默认只返回
        前 20 条（limit=20、offset=0）。Apple 同步本次新建的邮箱仍由响应的 `created` 字段单独返回；
        若同步成功后详情刷新失败，响应还会返回 `detail_stale: true`，表示详情分页是同步前快照。
      required:
        - account
        - aliases
        - pagination
        - apple_session
        - auto_creation
      properties:
        account:
          $ref: "#/components/schemas/AdminAccount"
        aliases:
          type: array
          description: 该主号在当前数据库分页中的隐私邮箱；不是全量列表。
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AdminAlias"
        pagination:
          $ref: "#/components/schemas/AdminAccountAliasPagination"
        apple_session:
          description: |
            该主号的 Apple Web 会话状态。正常启用目录同步服务时返回对象；
            服务未初始化的降级场景为 null。Apple 账户密码、验证码和加密会话正文不会返回。
          oneOf:
            - $ref: "#/components/schemas/AdminAppleSession"
            - type: "null"
        auto_creation:
          $ref: "#/components/schemas/AdminAliasAutoCreation"
        sync_pending:
          type: boolean
          description: |
            仅在手动邮件同步返回 202 时出现且恒为 true，表示请求已进入后台队列，
            或同一主号已有同步任务正在处理。

    AdminAccountPagination:
      type: object
      additionalProperties: false
      required:
        - limit
        - offset
        - total
        - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: 当前请求的每页上限。
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 当前请求跳过的主号数。
        total:
          type: integer
          minimum: 0
          description: 当前查询条件下的主号总数。
        has_more:
          type: boolean
          description: 当前页之后是否仍有可返回的主号。

    AdminAccountAliasPagination:
      type: object
      additionalProperties: false
      required:
        - limit
        - offset
        - total
        - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: 当前详情中 aliases 的每页上限。
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 当前详情中跳过的该主号隐私邮箱数。
        total:
          type: integer
          minimum: 0
          description: 该主号在数据库中的隐私邮箱总数，不受当前 limit 和 offset 影响。
        has_more:
          type: boolean
          description: 当前页之后是否仍有该主号的隐私邮箱可返回。

    AdminSyncProgress:
      type: object
      additionalProperties: false
      required:
        - active
        - source
        - stage
        - percentage
        - started_at
        - updated_at
      properties:
        active:
          type: boolean
          const: true
          description: 该对象出现时恒为 true；同步结束后整个 sync_progress 字段省略。
        source:
          type: string
          enum:
            - manual
            - automatic
          description: 本次同步由管理员手动发起，或由定时任务自动发起。
        stage:
          type: string
          enum:
            - queued
            - waiting
            - preparing
            - connecting
            - authenticating
            - scanning
            - reading
            - validating
            - saving
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminAppleSession:
      type: object
      additionalProperties: false
      required:
        - status
