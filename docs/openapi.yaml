openapi: 3.1.0
info:
  title: 隐私邮箱外部取件 API v2
  version: 2.0.0
  description: |
    本文档主要描述外部接口，并记录升级所需的少量管理兼容接口。服务提供两种
    取件能力：标准只读 IMAPS，以及使用 API Key 或派生取码 URL 读取验证码历史。

    管理端可为每个主号配置上游隐式 TLS IMAP 主机和端口；创建时默认使用
    `imap.mail.me.com:993`。修改规范化后的主机、端口或用户名代表切换邮箱来源，会清理
    旧来源的同步游标、兼容快照、消费历史、待处理 `\\Seen` 任务、v2 归档和 OTP 历史，
    轮换公开 IMAPS 的 `UIDVALIDITY`，并将同步状态重置为 `pending`。

    主号也可以使用 `custom` 邮箱模式并保存邮箱后缀。自定义随机邮箱使用 8–12 位
    ASCII 小写英文字母和数字作为本地部分，批量内和数据库中均禁止重复；该流程不调用 Apple，原 iCloud
    自动创建计划和限流规则保持不变。

    收件路由有三套：`mailbox_type=icloud` 加默认 `imap.mail.me.com:993` 是直连 iCloud IMAP；
    `mailbox_type=icloud` 加非默认 IMAP 来源（主机/端口或用户名不同于 iCloud 默认）是 iCloud 隐私邮箱转发到第三方 IMAP；
    `mailbox_type=custom` 是自定义域名邮箱，按原始投递收件人头匹配本地地址。

    如果 iCloud 隐私邮箱转发到第三方邮箱，仍应保持 `mailbox_type=icloud`，并将上游
    `imap_username` 填为第三方 IMAP 登录/最终物理投递目标地址（若该邮箱服务允许使用邮箱地址登录）。同步会优先使用
    `X-ICLOUD-HME` 的 `p=`/`f=` 路由信息，再结合 `Delivered-To`、`X-Original-To`、
    `Original-Recipient` 和常见 Apple 原始收件人头恢复隐私邮箱归属；Apple 的 `f=` 可以是中间
    转发地址，不必与最终 `Delivered-To` 相同。若只在 `To/Cc` 留下隐私地址，必须显式启用弱收件人头才会匹配。
    这些规则只控制邮件取件与归属；Apple 目录同步和自动创建仍使用现有的主号默认转发目标校验。

    IMAPS 用户名是隐私邮箱地址。客户端可以使用本服务签发的 IMAP 密码登录，
    或通过 `POST /oauth2/v2.0/token` 获取一小时访问令牌后使用 XOAUTH2。
    邮箱只有只读 INBOX，支持 LIST、STATUS、SELECT/EXAMINE、SEARCH、
    FETCH/UID FETCH 和 IDLE；所有写操作返回只读错误。

    新 v2 alias 的 API Key、IMAP 密码、client ID、refresh token 与 access token
    均由本服务签发。legacy alias 的兼容轮换只替换 API Key 和由其派生的旧直达链接，
    保留消费记录、邮件快照和 IMAP Seen 状态；v2 凭证包轮换才会同时使旧 API Key、
    取码 URL、IMAP 密码、refresh token 和尚未过期的 access token 失效。
    v2 的只读 OTP URL 与消费 recent-mail URL 使用不同用途的派生 token，不能互换；
    原 v1 直达 token 只继续授权 legacy alias 的 `/api/v1/mail/recent`。
    管理员可显式执行全量凭据轮换：所有 legacy alias 会强制迁移为 v2，所有现有
    v2 alias 及等待 Apple 目录确认的 pending 凭据也会同步轮换。该操作保留确认流程、
    邮件归档、消费与已读状态，但会使旧 v1 直达凭据和全部旧 v2 凭据失效；成功后
    撤销执行管理员的全部后台会话并要求重新登录。
    轮换会等待所有正在消费或返回 alias 凭据的公开 HTTP 请求写完响应后再提交；
    成功响应后，以旧 HTTP 凭据发起的新请求均被拒绝。旧 IMAP 密码和 access token
    不能再建立会话，已有 IMAPS 会话在下一条邮箱命令复验时失效；已经通过复验并
    开始执行的单条命令仍可完成。
    迁移前已经领取的 legacy alias 不会因 schema 升级而轮换。兼容接口
    `/api/v1/aliases`、`/api/v1/mail/latest` 和 `/api/v1/mail/recent`
    保留原有路径、鉴权和响应语义。

    迁移前已经领取的 alias 保持 `legacy` API Key；新 alias，以及迁移前尚未领取
    pending Key 的 alias，才会补齐 v2 凭证。`latest_messages`、消费记录、IMAP `Seen`
    任务、pending Key 和 `api_key_prefix` 在迁移中保留。

    管理端批量 Apple 删除保留同步 DELETE 的 200 契约；增加 `?async=1` 时以必填
    `operation_id` 提交幂等后台任务并返回 202，可按任务 ID 或当前管理员最近任务轮询。
    任务进度与逐项审计原子持久化，重启将未终结任务标为 `interrupted`，不自动重放。
    中断响应对尚无完成结果的项目合成 `BATCH_DELETE_INTERRUPTED`，远端结果待核查，
    不承诺本地记录仍在。存在 active 删除任务时，全量凭据轮换返回
    `409 BATCH_DELETE_IN_PROGRESS`，不占锁等待删除任务而阻塞进度读取。

    管理兼容接口同时挂载在安装级随机 `<admin-path>/api/v1` 和固定
    `/admin/api/v1`。固定入口仅用于旧客户端兼容，不提供管理界面；两个入口执行
    相同的登录限流、会话认证和 CSRF 校验。随机路径不是访问控制边界。
servers:
  - url: https://HOST
  # Admin operations below override this server with the installation-specific
  # path stored in the keys volume.
paths:
  /api/v1/pool/leases/{leaseID}/code:
    get:
      tags: [Mailbox Pool]
      operationId: readPoolLeaseCode
      summary: 读取项目所领取邮箱的最新验证码，可选有界等待
      description: |
        Pool Key 必须属于 lease 的项目。lease 为有效 leased 或 used，且主号和 alias 启用。
        查询起点取 after 与领取时间较晚者，只返回严格晚于起点的验证码。
        wait_seconds 默认 0，保留原单次按需读取；启用共享收件时正值允许等待新归档，
        预算包含首轮同步。正常到期仍返回 no_code，首轮同步未完成或上游错误返回 503。
        未配置共享通知时退回单次读取。等待不持有全局轮换/Pool 锁，最终重新校验归属及状态。
        同 alias 在途及完成后 2 秒内受 429 限制，被拦截请求不延长冷却。
      security:
        - poolKey: []
      parameters:
        - name: leaseID
          in: path
          required: true
          schema: {type: string}
        - name: after
          in: query
          schema: {type: string, format: date-time}
        - name: wait_seconds
          in: query
          description: 单个十进制整数；默认 0。HTTP 超时应留网络收尾余量。
          schema: {type: integer, minimum: 0, maximum: 15, default: 0}
      responses:
        "200":
          description: 命中新验证码或本次等待范围内无新码；不返回邮箱凭据。
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [success, otp, time, email]
                        properties:
                          success: {type: boolean, const: true}
                          otp: {type: string}
                          time: {type: string, format: date-time}
                          email: {type: string, format: email}
                      - type: object
                        required: [success, code, retryable, email]
                        properties:
                          success: {type: boolean, const: false}
                          code: {type: string, const: no_code}
                          retryable: {type: boolean, const: true}
                          email: {type: string, format: email}
        "400":
          description: INVALID_POOL_REQUEST，参数非法或 wait_seconds 重复。
        "401":
          description: INVALID_POOL_KEY，项目 Key 无效、已轮换或停用。
        "404":
          description: NOT_FOUND，lease 不存在或属于其他项目。
        "409":
          description: LEASE_CLOSED，领取关闭、过期或主号/alias 停用。
        "429":
          description: RATE_LIMITED，取件在途、冷却或容量已满。
          headers:
            Retry-After:
              schema: {type: string, const: "2"}
        "503":
          description: SYNC_UNAVAILABLE 或 POOL_UNAVAILABLE；同步异常时 Retry-After 为 3。
  /api/v1/aliases:
    post:
      tags:
        - Legacy Compatibility
      operationId: createLegacyAlias
      summary: 兼容登记已存在的隐私邮箱
      description: |
        保留 v1 的字段拼写 `add_hide_my_eamil`、`icloud`。两个字段可放在 query、
        `application/x-www-form-urlencoded` 正文，或分别放在两处；query 与正文合并后
        每个字段必须恰好出现一次，且不能包含其他字段。正文为空时不要求
        `Content-Type`。使用部署级 `ICLOUD_API_OAUTH_TOKEN` 的严格单一 Bearer 鉴权；
        成功响应直接返回 `api_key` 和 `mail_api_direct_link`；v2 凭证随后仍可由
        已认证管理端读取。该接口只登记 Apple 端已经存在的隐私邮箱，不负责创建
        地址。query 与正文合计不得超过 4 KiB。
      x-runtime-constraint:
        query-form-merge: >-
          OpenAPI 无法表达跨 query 与表单正文的联合必填约束；服务端合并两处参数后，
          要求 add_hide_my_eamil 与 icloud 各恰好出现一次，并拒绝任何其他字段。
      security:
        - externalOAuthToken: []
      parameters:
        - name: add_hide_my_eamil
          in: query
          required: false
          description: 可替代表单字段；合并 query 与正文后必须恰好出现一次。
          schema:
            type: string
            format: email
        - name: icloud
          in: query
          required: false
          description: 可替代表单字段；合并 query 与正文后必须恰好出现一次。
          schema:
            type: string
            format: email
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LegacyAliasRequest"
            example:
              add_hide_my_eamil: alias@icloud.com
              icloud: primary@icloud.com
      responses:
        "201":
          description: 登记成功并返回兼容 API Key 与直达链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyAliasResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidOAuthToken"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mail/latest:
    get:
      tags:
        - Legacy Compatibility
      operationId: getLegacyLatestMail
      summary: 兼容读取当前最新完整邮件快照
      description: |
        使用原有 `Authorization: Bearer <API Key>`。请求可重复执行，不消费邮件，
        不写入消费记录，也不改变 IMAP `Seen` 状态；已领取 legacy Key 和 v2 Key
        均可按绑定 alias 读取。
      security:
        - aliasAPIKey: []
      responses:
        "200":
          description: 当前最新邮件快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyLatestMailResponse"
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "404":
          $ref: "#/components/responses/MailNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mail/recent:
    get:
      tags:
        - Legacy Compatibility
      operationId: getLegacyRecentMail
      summary: 兼容消费最近一小时内的当前邮件
      description: |
        使用原有 `api_key` 查询参数（只能出现一次），接受 API Key、legacy alias 的
        原 v1 直达 token，或 v2 alias 的 recent-mail 专用 token。成功后原子记录消费
        状态并异步写入主号 IMAP `Seen`；同一 UID 的后续请求继续返回
        `MAIL_NOT_FOUND`。旧 legacy 直达链接保持路径和 token 不变；OTP 专用 token
        不授权此接口。
      security:
        - aliasAPIKeyQuery: []
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 当前快照已消费并加入 IMAP Seen 队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRecentMailResponse"
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "404":
          $ref: "#/components/responses/MailNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/otp:
    get:
      summary: 读取当前隐私邮箱的验证码历史
      description: |
        默认返回最新优先、持续累积的裸数组，每个邮箱最多 100 条。设置
        `ICLOUD_API_OTP_RETURN_LATEST_ONLY=true` 后，有记录时只返回该数组第一项的
        裸对象，也就是真正最新的有效 OTP。旧变量 `ICLOUD_API_OTP_RETURN_LAST_ONLY`
        保留为兼容别名；同时设置时以正式变量为准。
        重复读取不会消费验证码，也不会修改邮件已读状态。两种模式没有验证码时均返回 `200 []`。
        调用方必须二选一：使用 Bearer API Key，或传入管理端签发取码 URL 中的 OTP
        专用派生 token。迁移或轮换后 URL 路径仍为 `/api/v1/otp`；v2 alias 的 OTP
        token 保持用途隔离的 v3 公开信封版本，与 recent-mail 的 v2 信封分别签名。
        这里的 v3 只表示 token 信封版本，不表示新的 alias credential mode。
        recent-mail token 和原 v1 直达 token 不授权此接口。
      security:
        - aliasAPIKey: []
        - derivedToken: []
      parameters:
        - name: token
          in: query
          required: false
          description: 取码 URL 中的 OTP 专用派生 token；使用时不得同时发送 Authorization。
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 默认是验证码历史数组；最新单条模式有记录时为对象；没有记录时为一个空数组。
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OTPRecord"
                  - $ref: "#/components/schemas/OTPRecord"
              examples:
                records:
                  value:
                    - otp: "876543"
                      time: "2026-08-11T12:00:00+08:00"
                    - otp: "123456"
                      time: "2026-08-11T11:00:00+08:00"
                latestOnly:
                  value:
                    otp: "876543"
                    time: "2026-08-11T12:00:00+08:00"
                empty:
                  value: []
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/accounts:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    get:
      tags:
        - Admin Accounts
      operationId: listAdminAccounts
      summary: 查询主号列表
      description: |
        按主号邮箱、ID 升序返回分页列表。`query` 会先去除首尾空白，再对主号邮箱、自定义
        邮箱后缀和备注执行不区分大小写的字面量子串匹配；空查询返回全部主号。响应中的
        `pagination.total` 是当前查询条件下的主号总数，`has_more` 表示当前页之后是否还有结果。
      security:
        - adminSession: []
      parameters:
        - name: query
          in: query
          required: false
          description: 主号邮箱、自定义邮箱后缀或备注的搜索词；服务会先去除首尾空白，处理后的值最多 200 个字符。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 本页最多返回的主号数。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          required: false
          description: 在当前查询结果中跳过的主号数。
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: 当前查询条件下的一页主号
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountListResponse"
        "400":
          description: query、limit 或 offset 参数无效
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppleErrorResponse"
              examples:
                invalidLimit:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: limit 参数无效
                      request_id: 6oe7j0x3x3pJv9Dv
                queryTooLong:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: query 参数不能超过 200 个字符
                      request_id: 6oe7j0x3x3pJv9Dv
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    post:
      tags:
        - Admin Accounts
      operationId: createAdminAccount
      summary: 添加主号
      description: |
        添加用于主号级邮件同步的账户。`imap_host` 和 `imap_port` 可分别指定隐式 TLS
        IMAP 服务；省略时分别使用 `imap.mail.me.com` 和 `993`，显式传入 `null` 则返回 400。
        iCloud 模式保持原有 Apple 规则；若邮件由 iCloud 转发到第三方邮箱，仍选择 `icloud`，并应
        将 `imap_username` 填为第三方 IMAP 登录/最终物理投递目标地址，以便校验投递标头。选择 `custom` 后须填写 `email_suffix`，
        并在主号详情中按数量生成 8–12 位小写英文字母和数字随机邮箱。IMAP 密码只会加密保存，不会出现在响应或日志中。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateAccountRequest"
            example:
              name: 个人主号
              email: owner@icloud.com
              mailbox_type: icloud
              imap_host: imap.mail.me.com
              imap_port: 993
              imap_username: owner@icloud.com
              imap_password: APP_SPECIFIC_PASSWORD
      responses:
        "201":
          description: 主号创建成功
          headers:
            Location:
              description: 新主号的管理 API 相对路径。
              schema:
                type: string
                format: uri-reference
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResponse"
        "400":
          $ref: "#/components/responses/AdminAccountBadRequest"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "409":
          $ref: "#/components/responses/AdminAccountConflict"
        "413":
          $ref: "#/components/responses/AdminJSONTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "500":
