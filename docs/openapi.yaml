      summary: 获取主号详情
      description: |
        返回主号、所属隐私邮箱、Apple 会话状态和自动创建计划。`aliases` 只包含当前数据库
        分页；`pagination.total` 是该主号的隐私邮箱总数，`has_more` 表示当前页之后是否还有结果。
      security:
        - adminSession: []
      parameters:
