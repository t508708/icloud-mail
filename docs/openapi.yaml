              mailbox_type: icloud
              imap_host: imap.example.com
              imap_port: 993
              imap_username: owner@icloud.com
              imap_password: ""
              enabled: true
      responses:
        "200":
          description: 主号配置已更新
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResponse"
        "400":
          $ref: "#/components/responses/AdminAccountBadRequest"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "404":
          $ref: "#/components/responses/AdminAccountNotFound"
        "409":
          $ref: "#/components/responses/AdminAccountConflict"
        "413":
