      - url: https://HOST/admin
        description: 固定兼容管理入口
    get:
      tags: [Mailbox Pool, Administration]
      operationId: getPoolAliasRetirementJob
      summary: 查询当前项目的隐藏邮箱退休删除作业
      description: |
        同时校验管理员 Session 和 Pool Key；GET 不要求 CSRF。作业只允许创建它的 Pool 项目读取。
        返回仅含任务状态、稳定结果码及 alias/lease 项结果，不含 API Key、IMAP/OAuth 凭据、Cookie 或邮件内容。
        查询不启动、不恢复也不重放 Apple 操作。
      security:
