      summary: 查询当前管理员最近的批量 Apple 删除任务
      description: |
        每次查询都校验有效管理 Session，优先返回当前管理员的 active（queued/running）任务；
        没有 active 任务时，返回按创建时间最近的任务（同一时间按 job_id 降序），包括已完成或中断的任务。
        当前管理员没有任务时返回 {"data":null}。页面恢复且未保存键时可据此找回任务；
        已知 operation_id 或 job_id 时应直接按该 ID 轮询以定位指定操作。GET 不要求 X-CSRF-Token。
        正常进度只含已完成结果；interrupted 响应为其余项目合成 BATCH_DELETE_INTERRUPTED，
        远端结果待核查，不承诺本地记录仍在。读取状态不会启动或重放任务。
      security:
        - adminSession: []
      responses:
        "200":
          description: 当前管理员的 active 任务优先，否则为按创建时间最近的任务；没有任务时 data 为 null。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLatestAliasBatchDeleteJobResponse"
              example:
                data: null
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "500":
          $ref: "#/components/responses/AdminInternalError"

  /api/v1/aliases/batch/jobs/{jobID}:
    servers:
      - url: https://HOST/{admin_path}
