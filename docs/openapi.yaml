      properties:
        alias_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: 需要从 Apple 永久删除的本地隐私邮箱 ID。
    PoolAliasRetirementRequest:
      type: object
      additionalProperties: false
      required: [operation_id, items]
      properties:
        operation_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: 安装内全局唯一的幂等作业标识；原项目重试必须使用相同值和相同顺序的 items。
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PoolAliasRetirementItemRequest"
    PoolAliasRetirementItemRequest:
      type: object
      additionalProperties: false
      required: [alias_id, lease_id]
      properties:
        alias_id:
          type: integer
          format: int64
          minimum: 1
        lease_id:
          type: string
          minLength: 1
          maxLength: 128
    PoolAliasRetirementJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PoolAliasRetirementJob"
    PoolAliasRetirementJob:
      type: object
      additionalProperties: false
      required: [operation_id, status, total, processed, items, created_at, updated_at]
      description: 持久化的观察快照，不是可自动重放的队列；review/interrupted 保留 retiring lease，需人工核对 Apple 目录。
      properties:
        operation_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]{16,128}$'
        status:
          type: string
          enum: [queued, running, completed, review, interrupted]
        total:
          type: integer
          minimum: 1
          maximum: 100
        processed:
          type: integer
          minimum: 0
          maximum: 100
          description: 已进入 retired、used 或 review 的项目数。
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PoolAliasRetirementJobItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PoolAliasRetirementJobItem:
      type: object
      additionalProperties: false
      required: [alias_id, lease_id, state, result_code, result_message]
      properties:
        alias_id:
          type: integer
          format: int64
          minimum: 1
        lease_id:
          type: string
        state:
          type: string
          enum: [retiring, retired, used, review]
        result_code:
          type: string
          description: 稳定结果码；例如 APPLE_DELETE_FAILED、APPLE_DELETE_UNCERTAIN、JOB_INTERRUPTED、APPLE_RATE_LIMITED。
        result_message:
          type: string
          description: 非敏感展示信息；不含 Apple Cookie、邮箱凭据或邮件内容。
    AdminAsyncDeleteAliasesRequest:
      type: object
      additionalProperties: false
      required: [alias_ids, operation_id]
      description: |
        仅在 async=1 时使用；首次提交前保存 operation_id 和原始 alias_ids（包括顺序）。
        同一管理员重复提交同键同列表返回原任务，包含终态，不重新执行删除。
      properties:
        alias_ids:
          $ref: "#/components/schemas/AdminDeleteAliasesRequest/properties/alias_ids"
          description: 1–1000 个不重复的正整数；幂等重试须保持原列表及顺序。
        operation_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: |
            客户端提供的管理员范围内唯一任务 ID，同时作为 job_id；仅含 ASCII 字母、数字、- 或 _，
            推荐 UUID。任务身份、幂等键和读取均按管理员隔离，不同管理员可使用相同值创建各自任务。
            丢失提交响应后可直接用此值 GET /aliases/batch/jobs/{jobID}。
          example: a1b2c3d4-5678-4abc-8def-0123456789ab
    AdminAliasBatchDeleteJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminAliasBatchDeleteJob"
    AdminLatestAliasBatchDeleteJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          description: 当前管理员的 active 任务优先，否则为按创建时间最近的任务；没有任务时为 null。
          anyOf:
            - $ref: "#/components/schemas/AdminAliasBatchDeleteJob"
            - type: "null"
    AdminAliasBatchDeleteJob:
      type: object
      additionalProperties: false
      required: [job_id, status, requested, processed, deleted, failed, results, request_id, created_at, updated_at]
      description: |
        持久化任务快照，不是可自动重放的队列。queued/running 为 active，completed/interrupted 为终态。
        completed 只表示处理结束，不承诺整批成功。后台运行上限 2 小时；重启中断遗留 active 任务，
        已保存结果继续可查，不自动重新删除。进度与对应逐项 audit 在同一事务中持久化，
        该事务不覆盖 Apple 远端变更，因此中断后可能仍有结果待核查的项目。
      properties:
        job_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: 等于首次提交的 operation_id；按管理员隔离，不同管理员可拥有相同 job_id 的独立任务。
        status:
          type: string
          enum: [queued, running, completed, interrupted]
          description: completed 表示本次处理结束而非全部成功；interrupted 表示任务已停止且不会自动重放。
        requested:
          type: integer
          minimum: 1
          maximum: 1000
          description: 原始 alias_ids 的项目总数。
        processed:
          type: integer
          minimum: 0
          maximum: 1000
          description: 已持久化完成结果的项目数（成功或错误），最多 requested；不包括 HTTP 合成的中断剩余项。
        deleted:
          type: integer
          minimum: 0
          maximum: 1000
          description: results 中 deleted=true 的项目数；Apple 已确认删除或新目录确认缺失，且本地记录已清理。
        failed:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            results 中 deleted=false 的项目数；interrupted 时包含为未完成项合成的结果未知项，
            不等于已确认远端删除失败的数量。此时 deleted+failed 可能大于 processed。
        deferred:
          type: integer
          minimum: 0
          maximum: 1000
          description: 因主号限流预算耗尽而尚未执行的 APPLE_BATCH_DEFERRED 项目数，是 failed 的子集；零时可省略。
        waits:
          type: array
          maxItems: 2
          description: |
            当前进程中等待限流恢复的主号，按 account_id 排序；仅 active 任务返回，空时省略。
            等待不产生项目结果或增加 processed/failed，结束等待后清除。重启后任务为 interrupted，
            不恢复这些临时计时状态。客户端继续 GET 原任务，不应另建删除请求。
          items:
            $ref: "#/components/schemas/AdminAliasDeletionWait"
        results:
          type: array
          minItems: 0
          maxItems: 1000
          description: |
            按原 alias_ids 顺序返回。非 interrupted 时只含已有完成结果的项目，初始可为空数组，
            不为待处理项预填成功或失败。interrupted 时保留已有结果，并为尚无完成结果的项目
            合成 deleted=false、code=BATCH_DELETE_INTERRUPTED 和待核查 message；这些项的
            local_retained 为 false，序列化时省略，不证明远端仍存在，也不证明本地已删除或仍在。
            合成项计入 failed，但不计入 processed；使用 processed 读取进度，
            不以 results.length 或 deleted+failed 代替已处理数量。
          items:
            $ref: "#/components/schemas/AdminAliasBatchDeleteItem"
        request_id:
          type: string
          description: 首次提交请求的追踪标识，供进度和 audit 关联；不必等于本次轮询或重试响应的 X-Request-ID。
        created_at:
          type: string
          format: date-time
          description: 任务创建时间，UTC RFC 3339 格式，可含小数秒。
        updated_at:
          type: string
          format: date-time
          description: 任务最近一次持久化更新时间，UTC RFC 3339 格式，可含小数秒。
    AdminAliasDeletionWait:
      type: object
      additionalProperties: false
      required: [account_id, alias_id, operation, retry_at, attempt, max_attempts]
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
        alias_id:
          type: integer
          format: int64
          minimum: 1
        operation:
          type: string
          enum: [validate, list, deactivate, delete, ""]
          description: 触发等待的固定步骤名；适配器未提供已知步骤时为空。
        retry_at:
          type: string
          format: date-time
          description: UTC 预计重试时间；由本地退避及 Apple Retry-After 的较长者决定，不是成功保证。
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        max_attempts:
          type: integer
          const: 3
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: 已知的 Apple HTTP 状态码；可能为 200，业务限流通过 service_code 表达。
        service_code:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9_.-]*$'
          description: 已知的非敏感业务码；不包含上游正文、URL 或登录凭据。
    AdminAliasBatchDeleteResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminAliasBatchDelete"
    AdminAliasBatchDelete:
      type: object
      additionalProperties: false
      required: [requested, deleted, failed, results]
      properties:
        requested:
          type: integer
          minimum: 1
        deleted:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminAliasBatchDeleteItem"
    AdminAliasBatchDeleteItem:
      type: object
      additionalProperties: false
      required: [id, address, deleted]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        address:
          type: string
          format: email
        deleted:
          type: boolean
          description: Apple 已确认删除或新目录确认地址缺失，且本地记录已清理；中断项的 false 不证明远端仍存在。
        code:
          type: string
          description: 错误项的稳定错误码；BATCH_DELETE_INTERRUPTED 表示中断、远端结果待核查；APPLE_BATCH_DEFERRED 表示主号持续限流后尚未执行。
        message:
          type: string
          description: 错误项的可展示说明；本地记录保留情况应结合 local_retained 判断，中断结果不承诺保留。
        local_retained:
          type: boolean
          description: |
            true 表示本次失败处理保留了本地记录。实现中的 false 会在 JSON 中省略；
            中断剩余项及任务执行时本地记录已不存在的 NOT_FOUND 项不承诺保留，
            不应从字段省略推断本地记录已删除或仍在。
    AdminAlias:
      type: object
      additionalProperties: true
      required: [id, account_id, account_email, address, label, enabled]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        account_id:
          type: integer
          format: int64
          minimum: 1
        account_email:
          type: string
          format: email
        address:
          type: string
          format: email
        label:
          type: string
        group_id:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
          description: 可选邮箱分组；null 表示未分组。
        group_name:
          type: string
          description: 分组名称；未分组时为空字符串。
        api_key_prefix:
          type: string
        direct_link_path:
          type: string
          format: uri-reference
          description: recent-mail 消费路径；legacy 保留原 v1 token，v2 使用 recent-mail 专用 token；等待 Apple 目录确认时省略。
        legacy_direct_link_path:
          type: string
          format: uri-reference
        otp_url_path:
          type: string
          format: uri-reference
          description: v2 使用只读 OTP 专用 token；legacy 保持原 recent-mail 兼容路径。
        credential_mode:
          type: string
          enum: [legacy, v2]
        api_key:
          type: string
          description: 仅在服务持有可解密的 v2 凭证时返回明文。
        imap_password:
          type: string
        client_id:
          type: string
        refresh_token:
          type: string
        credential_version:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
    AdminMailGroup:
      type: object
      additionalProperties: false
      required: [id, name, alias_count, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        alias_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminMailGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    AdminMailGroupResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminMailGroup"
    AdminMailGroupListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminMailGroup"
            groups:
              type: array
              description: items 的兼容别名。
              items:
                $ref: "#/components/schemas/AdminMailGroup"
    AdminMoveAliasesToGroupRequest:
      type: object
      additionalProperties: false
      required: [alias_ids, group_id]
      properties:
        alias_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1
        group_id:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
    APIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    AdminAuthUnauthorized:
      description: 后台会话 Cookie 缺失、无效或已经过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            loginRequired:
              value:
                error:
                  code: AUTH_REQUIRED
                  message: 请先登录
                  request_id: 6oe7j0x3x3pJv9Dv
            sessionExpired:
              value:
                error:
                  code: SESSION_EXPIRED
                  message: 登录会话已过期
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountBadRequest:
      description: JSON 格式错误、含有未知字段，或主号字段校验失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            invalidJSON:
              value:
                error:
                  code: INVALID_JSON
                  message: JSON 请求体格式错误或包含未知字段
                  request_id: 6oe7j0x3x3pJv9Dv
            invalidIMAPHost:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: "IMAP 服务地址无效: invalid imap DNS label"
                  request_id: 6oe7j0x3x3pJv9Dv
            invalidIMAPPort:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: "IMAP 服务地址无效: imap port must be between 1 and 65535"
                  request_id: 6oe7j0x3x3pJv9Dv
            nullIMAPHost:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: IMAP 主机不能为 null
                  request_id: 6oe7j0x3x3pJv9Dv
            nullIMAPPort:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: IMAP 端口不能为 null
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminCSRFForbidden:
      description: X-CSRF-Token 缺失、无效，或请求未通过同源校验
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: CSRF_INVALID
              message: 请求校验失败，请刷新页面后重试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountConflict:
      description: 主号邮箱已存在，或已有隐私邮箱后尝试修改主号邮箱
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            accountExists:
              value:
                error:
                  code: ACCOUNT_EXISTS
                  message: 这个主号已经存在
                  request_id: 6oe7j0x3x3pJv9Dv
            identityLocked:
              value:
                error:
                  code: ACCOUNT_IDENTITY_LOCKED
                  message: 已有隐私邮箱时不能修改主号邮箱
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminRandomAliasConflict:
      description: 随机邮箱生成因主号停用、邮箱模式或后缀变化、地址冲突而整批拒绝
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            accountDisabled:
              value:
                error:
                  code: ACCOUNT_DISABLED
                  message: 主号已停用，请先启用主号后再生成邮箱
                  request_id: 6oe7j0x3x3pJv9Dv
            customMailboxRequired:
              value:
                error:
                  code: CUSTOM_MAILBOX_REQUIRED
                  message: 随机邮箱仅适用于自定义邮箱主号
                  request_id: 6oe7j0x3x3pJv9Dv
            accountChanged:
              value:
                error:
                  code: ACCOUNT_CHANGED
                  message: 主号邮箱后缀已发生变化，请刷新后重试
                  request_id: 6oe7j0x3x3pJv9Dv
            aliasExists:
              value:
                error:
                  code: ALIAS_EXISTS
                  message: 生成的邮箱地址发生冲突，请重试
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminJSONTooLarge:
      description: JSON 请求体超过 64 KiB
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: JSON 请求体不能超过 64 KiB
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountNotFound:
      description: 指定的本地主号不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: 主号不存在
              request_id: 6oe7j0x3x3pJv9Dv

    InvalidRequest:
      description: 参数缺失、重复、格式错误，或包含不支持的字段（`INVALID_REQUEST`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InvalidCredential:
      description: Bearer 凭据、API Key 或派生 token 无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InvalidOAuthToken:
      description: 部署级 OAuth Bearer 凭据无效（`INVALID_OAUTH_TOKEN`）。
      headers:
        WWW-Authenticate:
          description: Bearer 鉴权提示。
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    MailNotFound:
      description: 当前没有符合条件且尚未消费的邮件（`MAIL_NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    NotFound:
      description: 请求的主号、alias 或邮件不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    Conflict:
      description: alias 已存在或主号已达到启用数量上限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    RequestTooLarge:
      description: query 与正文合计超过 4 KiB（`REQUEST_TOO_LARGE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    UnsupportedMediaType:
      description: 非空正文没有使用 `application/x-www-form-urlencoded`（`UNSUPPORTED_MEDIA_TYPE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    RateLimited:
      description: 请求过于频繁。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    Unavailable:
      description: 服务暂不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InternalError:
      description: 服务处理凭据或直达链接时发生内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminBadRequest:
      description: JSON 无效、包含未知字段或业务参数校验失败（`INVALID_JSON` 或 `VALIDATION_FAILED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminUnauthorized:
      description: 管理会话缺失或已过期（`AUTH_REQUIRED` 或 `SESSION_EXPIRED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminRotationUnauthorized:
      description: 管理会话缺失或已过期，或当前管理员密码缺失/错误（`AUTH_REQUIRED`、`SESSION_EXPIRED` 或 `CURRENT_PASSWORD_INVALID`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminForbidden:
      description: CSRF token 或同源校验失败（`CSRF_INVALID`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminNotFound:
      description: 管理资源不存在或路径 ID 无效（`NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminMailGroupNotFound:
      description: 邮箱分组不存在或路径 ID 无效（`GROUP_NOT_FOUND` 或 `NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminAliasOrMailGroupNotFound:
      description: 隐私邮箱或目标邮箱分组不存在（`NOT_FOUND` 或 `GROUP_NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminAliasConflict:
      description: alias 等待 Apple 确认或不支持所请求的凭证轮换模式（`ALIAS_CONFIRMATION_PENDING` 或 `ALIAS_CREDENTIAL_MODE_UNSUPPORTED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminBatchAliasDeleteConflict:
      description: |
        批量删除的邮箱不满足 Apple 删除条件，例如主号尚未完成 Apple 登录、存在同步错误、
        使用自定义邮箱模式，或邮箱仍在等待 Apple 目录确认。
        异步请求还包括 BATCH_DELETE_IN_PROGRESS（当前管理员已有 active 任务或凭据正在轮换）
        以及 IDEMPOTENCY_CONFLICT（同一管理员的原键绑定了不同 alias_ids 列表，包括顺序变化）。
        同键同列表重试返回 202 原任务，不另占名额；等待提交准入时请求取消可返回 BATCH_DELETE_INTERRUPTED。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            activeJob:
              value:
                error:
                  code: BATCH_DELETE_IN_PROGRESS
                  message: 已有后台删除任务，请先查看该任务的进度
                  request_id: 6oe7j0x3x3pJv9Dv
            idempotencyConflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: 该任务编号已经用于其他删除选择，请使用原任务查看结果
                  request_id: 6oe7j0x3x3pJv9Dv
    AdminBatchAliasDeleteBusy:
      description: |
        异步新任务因服务全局已有 2 个 active 任务而暂缓接收（BATCH_DELETE_BUSY）；
        稍后用原 operation_id 和原列表重试，已有任务的幂等重试不新占名额。
        前置 Apple 会话检查若返回上游限流，也可返回 APPLE_RATE_LIMITED；按 error.code 区分。
        此响应不保证 Retry-After 响应头。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: BATCH_DELETE_BUSY
              message: 后台删除任务已满，请稍后提交
              request_id: 6oe7j0x3x3pJv9Dv
    AdminBatchAliasDeleteUnavailable:
      description: |
        后台执行器尚未启动或正在关闭，暂不接收异步新任务（BATCH_DELETE_UNAVAILABLE）。
        等服务就绪后使用原 operation_id 和原列表重试。已有任务仍可通过 GET 查询。
        若 Apple 同步服务未配置，同步或异步提交也可返回 503 INTERNAL_ERROR；按 error.code 区分。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminAliasBatchDeleteCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: BATCH_DELETE_UNAVAILABLE
              message: 后台删除服务尚未启动或正在关闭，请稍后重试
              request_id: 6oe7j0x3x3pJv9Dv
    AdminCredentialsChanged:
      description: 全量轮换提交前发现管理员凭据版本已并发变化（`CREDENTIALS_CHANGED`）；轮换事务回滚并清除当前浏览器的管理 Session Cookie，调用方必须重新登录。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminMailGroupConflict:
      description: 邮箱分组名称已存在（`GROUP_EXISTS`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminRequestTooLarge:
      description: JSON 请求体超过 64 KiB（`REQUEST_TOO_LARGE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminUnsupportedMediaType:
      description: JSON 管理操作未使用 `application/json`（`UNSUPPORTED_MEDIA_TYPE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminRateLimited:
      description: 高风险凭据轮换或当前密码重认证请求过于频繁（`RATE_LIMITED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminInternalError:
      description: 管理 API 处理失败（`INTERNAL_ERROR`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    OAuthInvalidRequest:
      description: OAuth 表单格式错误。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: invalid_request
              error_description:
                type: string
    OAuthInvalidClient:
      description: client ID 或 refresh token 无效。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: invalid_client
              error_description:
                type: string
    OAuthUnavailable:
      description: 令牌服务暂不可用或请求受到限流。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: temporarily_unavailable
              error_description:
                type: string
