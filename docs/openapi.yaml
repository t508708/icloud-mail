        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    delete:
      tags:
        - Admin Accounts
      operationId: deleteAdminAccount
      summary: 删除主号
      description: |
        永久删除本地主号及其所属隐私邮箱、API Key、邮件快照、消费历史、待处理 `\Seen` 任务、
        v2 归档元数据和 MIME 文件、IMAP 同步游标、Apple Web 会话和自动创建计划。该操作只
        清理本地数据，不会删除 Apple Hide My Email 中的远端地址。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
